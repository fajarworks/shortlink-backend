basePath: /
definitions:
  dto.CreateShortlinkRequest:
    properties:
      destination_url:
        type: string
      slug:
        type: string
    required:
    - destination_url
    type: object
  dto.CreateUser:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.ErrorResponse:
    properties:
      message:
        type: string
      success:
        type: boolean
    type: object
  dto.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  dto.Response:
    properties:
      message:
        type: string
      result: {}
      success:
        type: boolean
    type: object
  dto.ShortlinkResponse:
    properties:
      click_count:
        type: integer
      created_at:
        type: string
      destination_url:
        type: string
      id:
        type: integer
      slug:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: Aplication for eventhub API
  title: Shortlink App
  version: "1.0"
paths:
  /auth/login:
    post:
      consumes:
      - application/json
      description: Authenticate user and return JWT token with user information
      parameters:
      - description: Login credentials
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Login successfully
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Invalid request or empty field
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Wrong email or password
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      summary: Login user
      tags:
      - Auth
  /auth/logout:
    post:
      description: Logout user by invalidating the current JWT token
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "401":
          description: Unauthorized or invalid token
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Logout user
      tags:
      - Auth
  /auth/register:
    post:
      consumes:
      - application/json
      description: Create a new user account
      parameters:
      - description: User registration data
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/dto.CreateUser'
      produces:
      - application/json
      responses:
        "201":
          description: User successfully registered
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Invalid request body or empty field
          schema:
            $ref: '#/definitions/dto.Response'
        "409":
          description: User already exists
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.Response'
      summary: Register new user
      tags:
      - Auth
  /links:
    get:
      description: Get all active shortlinks owned by the authenticated user
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/dto.ShortlinkResponse'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Get my shortlinks
      tags:
      - Shortlinks
    post:
      consumes:
      - application/json
      description: Membuat shortlink baru dengan custom slug atau slug otomatis
      parameters:
      - description: Data shortlink
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateShortlinkRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/dto.Response'
            - properties:
                result:
                  $ref: '#/definitions/dto.ShortlinkResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/dto.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create shortlink
      tags:
      - Shortlinks
  /links/{id}:
    delete:
      description: Soft delete a shortlink owned by the authenticated user
      parameters:
      - description: Shortlink ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dto.Response'
        "400":
          description: Invalid shortlink ID
          schema:
            $ref: '#/definitions/dto.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/dto.Response'
        "404":
          description: Shortlink not found
          schema:
            $ref: '#/definitions/dto.Response'
        "500":
          description: Internal server error
          schema:
            $ref: '#/definitions/dto.Response'
      security:
      - BearerAuth: []
      summary: Delete shortlink
      tags:
      - Links
securityDefinitions:
  BearerAuth:
    description: Bearer token used as identiity for accessing backend
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
